name: CI/CD - PetWise Frontend

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: petwise-frontend

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test -- --passWithNoTests

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir ambiente
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "ecs_cluster=${{ secrets.ECS_CLUSTER_PROD }}" >> $GITHUB_OUTPUT
            echo "ecs_service=${{ secrets.ECS_SERVICE_FRONTEND_PROD }}" >> $GITHUB_OUTPUT
            echo "next_public_api_url=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "ecs_cluster=${{ secrets.ECS_CLUSTER_STAGING }}" >> $GITHUB_OUTPUT
            echo "ecs_service=${{ secrets.ECS_SERVICE_FRONTEND_STAGING }}" >> $GITHUB_OUTPUT
            echo "next_public_api_url=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push da imagem no ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.next_public_api_url }}
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT-latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT-latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy no ECS
        run: |
          aws ecs update-service \
            --cluster ${{ steps.env.outputs.ecs_cluster }} \
            --service ${{ steps.env.outputs.ecs_service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Aguardar deploy estabilizar
        run: |
          aws ecs wait services-stable \
            --cluster ${{ steps.env.outputs.ecs_cluster }} \
            --services ${{ steps.env.outputs.ecs_service }} \
            --region ${{ env.AWS_REGION }}
